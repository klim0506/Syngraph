name: syngraph

services:
  bank:
    build:
      context: .
      target: bank
    init: true
    restart: unless-stopped
    volumes:
      - bank-data:/app/demo/bank-sandbox/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/accounts/1', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  core:
    build:
      context: .
      target: core
    init: true
    restart: unless-stopped
    environment:
      BANK_URL: http://bank:8001
    volumes:
      - core-data:/app/product/core/data
    depends_on:
      bank:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/clients/1/agents', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mcp:
    build:
      context: .
      target: mcp
    init: true
    restart: unless-stopped
    environment:
      BANK_URL: http://bank:8001
    volumes:
      - core-data:/app/product/core/data
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SYNGRAPH_PORT:-8088}:80"
    depends_on:
      core:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  core-data:
  bank-data:
