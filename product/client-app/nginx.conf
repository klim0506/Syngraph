server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core http://core:8000;
    set $bank http://bank:8001;
    set $mcp http://mcp:8002;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /api/ {
        proxy_pass $core$request_uri;
        proxy_read_timeout 40s;
    }

    location = /core { return 302 /core/docs; }
    location /core/ {
        rewrite ^/core/(.*)$ /$1 break;
        proxy_pass $core;
        proxy_read_timeout 40s;
    }

    location = /bank { return 302 /bank/docs; }
    location /bank/ {
        rewrite ^/bank/(.*)$ /$1 break;
        proxy_pass $bank;
    }

    location = /mcp {
        proxy_pass $mcp$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 90s;
        access_log off;
    }
    location /mcp/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
